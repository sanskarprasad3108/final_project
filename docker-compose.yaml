# =============================================================================
# DOCKER COMPOSE - LOCAL DEVELOPMENT & TESTING
# =============================================================================
# Usage: docker-compose up --build
# Version: 2.0 - Added anomaly history persistence
# =============================================================================

version: '3.8'

services:
  anomaly-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dump-truck-anomaly-detector
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - TF_CPP_MIN_LOG_LEVEL=2
    volumes:
      # Persist anomaly history data across container restarts
      - anomaly-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Named volumes for data persistence
volumes:
  anomaly-data:
    driver: local
